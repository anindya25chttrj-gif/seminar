<!DOCTYPE html>
<html>
<head>
    <title>Account Setup</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #45a049; }
        .error { color: red; font-size: 14px; text-align: center; }
        h3 { color: #333; margin-top: 0; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Welcome! Complete Account Setup</h3>
        <p style="font-size: 14px; color: #666; text-align: center;">Please change your default password and set a security question for account recovery.</p>
        
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        
        <form method="POST">
            <label>New Password</label>
            <input type="password" name="new_password" required minlength="6">
            
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" required minlength="6">
            
            <label style="margin-top: 15px; display: block;">Select a Security Question</label>
            <select name="security_q" required>
                <option value="What is the name of your first pet?">What is the name of your first pet?</option>
                <option value="In what city were you born?">In what city were you born?</option>
                <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                <option value="What was your childhood nickname?">What was your childhood nickname?</option>
            </select>
            
            <label>Your Answer</label>
            <input type="text" name="security_a" required>
            
            <button type="submit">Save and Continue</button>
        </form>
    </div>
</body>
</html>
