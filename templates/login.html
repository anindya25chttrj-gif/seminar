<!DOCTYPE html>
<html>
<head>
    <title>Login - Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card {
    /* Replace fixed width with these three lines: */
    width: 90%; 
    max-width: 400px; 
    box-sizing: border-box; 
    
    /* Keep your existing styles (background, padding, border-radius) below */
    background: rgba(255, 255, 255, 0.95);
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
        h2 { text-align: center; color: #333; margin-top: 0; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        button:hover { background: #45a049; }
        .error { color: #e74c3c; font-size: 14px; text-align: center; }
        .success { color: #2ecc71; font-size: 14px; text-align: center; font-weight: bold; }
        .links { text-align: center; margin-top: 15px; font-size: 14px; }
        .links a { color: #764ba2; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>University Portal</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        {% if msg %}<p class="success">{{ msg }}</p>{% endif %}
        
        <form method="POST">
            <select name="role" required>
                <option value="students">Student</option>
                <option value="teachers">Teacher (Admin)</option>
            </select>
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        
        <div class="links">
            <a href="/forgot_password">Forgot Password?</a>
        </div>
    </div>
</body>
</html>
