<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #45a049; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .logout { color: #f44336; text-decoration: none; font-size: 14px; }
        .result { margin-top: 20px; padding: 15px; background: #e8f5e9; border: 1px solid #4CAF50; border-radius: 4px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h3>Welcome, {{ user.name }}</h3>
            <a href="/logout" class="logout">Logout</a>
        </div>
        <p style="color: #666; font-size: 14px;">Program: {{ user.course }} | Section: {{ user.section }}</p>
        
        <form method="POST">
            <label>Current Attendance (%)</label>
            <!-- Added readonly and a gray background to indicate it cannot be changed -->
            <input type="number" step="any" name="attendance" value="{{ current_attendance }}" readonly style="background-color: #e9ecef; cursor: not-allowed;">
            
            <label>Average Study Hours / Week</label>
            <!-- Uses the dynamic variable that retains user input after predicting -->
            <input type="number" step="0.1" name="study_hours" value="{{ display_study_hours }}" required>
            
            <label>Previous Semester CGPA</label>
            <!-- Uses the dynamic variable that retains user input after predicting -->
            <input type="number" step="0.1" name="prev_cgpa" value="{{ display_prev_cgpa }}" required>
            
            <button type="submit">Predict Final CGPA</button>
        </form>

        {% if prediction %}
        <div class="result">
            <h4>Predicted Final CGPA</h4>
            <h2 style="color: #2e7d32; margin: 0;">{{ prediction }}</h2>
        </div>
        {% endif %}
    </div>
</body>
</html>
