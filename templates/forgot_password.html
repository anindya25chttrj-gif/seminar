<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; box-sizing: border-box; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #764ba2; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #5a3780; }
        .error { color: red; font-size: 14px; text-align: center; }
        .back { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h3 style="text-align: center;">Reset Password</h3>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}

        {% if step == 1 %}
        <!-- STEP 1: Identify User -->
        <p style="font-size: 14px; color: #666; text-align: center;">Enter your details to find your account.</p>
        <form method="POST">
            <input type="hidden" name="action" value="get_question">
            <select name="role" required>
                <option value="students">Student</option>
                <option value="teachers">Teacher</option>
            </select>
            <input type="text" name="username" placeholder="Username" required>
            <button type="submit">Continue</button>
        </form>
        {% endif %}

        {% if step == 2 %}
        <!-- STEP 2: Answer Security Question & Reset -->
        <form method="POST">
            <input type="hidden" name="action" value="reset_password">
            <input type="hidden" name="role" value="{{ role }}">
            <input type="hidden" name="username" value="{{ username }}">
            
            <p style="font-weight: bold; font-size: 14px;">Security Question:</p>
            <p style="background: #eee; padding: 10px; border-radius: 4px; font-size: 14px;">{{ question }}</p>
            
            <input type="text" name="security_a" placeholder="Enter your answer" required>
            <input type="password" name="new_password" placeholder="Enter new password" required minlength="6">
            
            <button type="submit">Reset Password</button>
        </form>
        {% endif %}

        <a href="/" class="back">Back to Login</a>
    </div>
</body>
</html>
